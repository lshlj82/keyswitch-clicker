<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A key switch that lights up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem("netsci-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>

:root{
  --paper:#F6F8FB; --grid:#E1E8F0; --ink:#1A2433; --muted:#5B6779; --panel:#FFFFFF; --line:#C8D2DE;
  --cyan:#5DEBEE; --magenta:#E55ADC; --red:#DE3127; --blue:#2B46D4; --green:#18924A;
  --copper:#C9773F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#132039; --grid:#1B2B48; --ink:#E7EDF6; --muted:#9DAAC0; --panel:#192946; --line:#2D4064;
    --cyan:#47DDE1; --magenta:#F07AE8; --red:#FF5B4F; --blue:#93A6FF; --green:#4FD27F; --copper:#E39461;
  }
}
:root[data-theme="dark"]{
  --paper:#132039; --grid:#1B2B48; --ink:#E7EDF6; --muted:#9DAAC0; --panel:#192946; --line:#2D4064;
  --cyan:#47DDE1; --magenta:#F07AE8; --red:#FF5B4F; --blue:#93A6FF; --green:#4FD27F; --copper:#E39461;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
i,.m{font-style:italic}
sub{font-size:.7em}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px;border-radius:3px}

/* nav */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.toc{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{white-space:nowrap;text-decoration:none;color:var(--muted);font-size:14px;padding:4px 9px;border-radius:6px}
.toc a:hover{color:var(--ink);background:var(--grid)}
.toc a span{color:var(--blue);font-weight:700;margin-right:4px}
.langlink{flex:none;font-size:14px;padding:4px 12px;border:1.5px solid var(--ink);border-radius:8px;color:var(--ink);text-decoration:none}
.langlink:hover{background:var(--ink);color:var(--paper)}

/* hero */
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.hero{padding:56px 0 28px}
.credit{font-size:15px;color:var(--muted);margin:0 0 18px;max-width:60ch}
.credit b{color:var(--ink);font-weight:500}
h1{font-size:clamp(40px,7vw,78px);line-height:1.04;letter-spacing:-.02em;margin:0;font-weight:700;max-width:14ch}
.hero p.sub{font-size:19px;max-width:56ch;margin:18px 0 0}
.hero-wire{width:100%;height:auto;display:block;margin-top:34px}
.scrawl{color:var(--blue);font-size:15px;font-weight:500;line-height:1.5;border-left:3px solid currentColor;padding:2px 0 2px 12px;max-width:52ch}

/* sections */
section{padding:56px 0 24px;border-top:1px dashed var(--line)}
h2{font-size:clamp(26px,3.6vw,36px);line-height:1.15;margin:0 0 14px;letter-spacing:-.01em;display:flex;gap:14px;align-items:baseline}
h2 .n{font-size:.62em;color:var(--blue);border:2px solid var(--blue);border-radius:50%;width:1.7em;height:1.7em;display:inline-grid;place-items:center;flex:none;transform:translateY(-.15em)}
.prose{max-width:68ch}
.prose p{margin:0 0 12px}
.key{display:inline-flex;flex-wrap:wrap;gap:10px 34px;align-items:center;border:6px solid var(--cyan);border-radius:5px;padding:12px 22px;margin:8px 0 22px;font-size:19px;background:var(--panel)}
.key span{white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.15;margin:0 2px}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}

.sim{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,1fr);gap:18px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:18px}
@media (max-width:820px){.sim{grid-template-columns:1fr}}
.viz{min-width:0;display:flex;flex-direction:column;gap:12px}
.viz svg,.viz canvas{width:100%;display:block}
.controls{display:flex;flex-direction:column;gap:12px;min-width:0}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.ctl output{font-variant-numeric:tabular-nums;font-weight:500}
input[type=range]{width:100%;accent-color:var(--blue);margin:4px 0 0}
select{font:inherit;font-size:15px;width:100%;padding:6px 8px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{font:inherit;font-size:14px;padding:5px 11px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--panel)}
.check{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer}
.check input{accent-color:var(--blue);width:17px;height:17px}
.lbl{font-size:15px;margin-bottom:4px;display:block}
dl.read{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin:4px 0 0;font-size:15px;border-top:1px solid var(--line);padding-top:10px}
dl.read dt{color:var(--muted)}
dl.read dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.verdict{font-size:15px;padding:8px 12px;border-radius:8px;border-left:5px solid var(--magenta);background:color-mix(in srgb,var(--magenta) 10%,transparent)}
.aside{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.aside{grid-template-columns:1fr}}
.boxed{border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel);font-size:16px}
.boxed h3{margin:0 0 6px;font-size:17px}

.mag{color:var(--magenta)}
.bars{display:flex;flex-direction:column;gap:7px;font-size:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:8px;align-items:center}
.bar-track{height:14px;background:var(--grid);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;transition:width .15s}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums}
.bar-cap{grid-column:1/-1;color:var(--muted);margin-bottom:-4px}
table.tbl{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:500}
.eq{font-size:16px;line-height:1.7}
.eq .sum{font-weight:700}
.small{font-size:14px;color:var(--muted)}
footer{padding:40px 0 60px;border-top:1px dashed var(--line);margin-top:40px;color:var(--muted);font-size:15px}
svg text{font-family:"IBM Plex Sans KR",system-ui,sans-serif;fill:var(--ink)}
svg .wire{stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linejoin:round}
svg .flow{stroke:var(--red);stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:0.1 15}
svg .axis{stroke:var(--muted);stroke-width:1.2}
svg .gridl{stroke:var(--grid);stroke-width:1}
@media (prefers-reduced-motion:reduce){.bar-fill{transition:none}}


button.theme-btn{position:fixed; z-index:20; top:calc(env(safe-area-inset-top, 0px) + 12px); right:calc(env(safe-area-inset-right, 0px) + 12px);
  width:40px; height:40px; padding:0; border-radius:50%; display:grid; place-items:center; cursor:pointer;
  background:var(--panel); color:var(--ink); border:1px solid var(--line); box-shadow:0 1px 4px rgba(0,0,0,.12)}
button.theme-btn:hover{background:var(--panel); color:var(--ink); border-color:var(--ink)}
button.theme-btn:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
.bar{padding-right:60px}
button.theme-btn svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

:root{--led:#47E3F0;--cap:#E2A36C;--silver:#B9C2CE;--leaf:#C9773F}
:root[data-theme="dark"]{--cap:#C98852;--silver:#8D99AA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cap:#C98852;--silver:#8D99AA}}
html[lang="ko"] body{word-break:keep-all}
/* equations: a formal serif math face for variables, symbols, and sub/superscripts */
:root{--math:"STIX Two Text","STIX Two Math","Cambria Math","Cambria","Times New Roman",serif}
i:not(:empty),.mf,sub,sup{font-family:var(--math)}
i:not(:empty){font-size:1.08em;letter-spacing:.01em}
.mf{font-style:normal;font-size:1.08em}
.key{font-family:var(--math);font-size:22px;gap:10px 40px}
.key span{letter-spacing:.01em}
.hero{padding:44px 0 10px}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.photos figure{margin:0;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.photos img{display:block;width:100%;height:230px;object-fit:cover}
.photos figcaption{font-size:14px;color:var(--muted);padding:8px 11px 10px;line-height:1.45}
.photos.hero-ph img{height:260px}
.phhead{font-size:15px;color:var(--muted);margin:22px 0 0}
.phhead b{color:var(--ink)}
.press-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn.big{font-size:16px;padding:10px 22px;border-width:2px;border-color:var(--ink);font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none}
.btn.big[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--line)}
.state i{font-style:normal;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.state.on{border-color:var(--green)} .state.on i{background:var(--green)}
#hero svg{touch-action:none;user-select:none;-webkit-user-select:none}
.legendrow{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted)}
.legendrow .sw{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:4px;margin-right:6px}
.legendrow .sw.d{border-top-style:dashed}
.pinpick{display:grid;grid-template-columns:1fr;gap:8px 10px;align-items:center;font-size:15px}
.ok{border-left-color:var(--green)!important;background:color-mix(in srgb,var(--green) 10%,transparent)!important}
</style>
</head>
<body>
<button id="themeBtn" class="theme-btn" type="button" aria-label=""></button>

<nav class="bar" aria-label="Sections">

    <div class="toc">
      <a href="#s1"><span>1</span><x data-i18n="nav1"></x></a>

<header class="wrap hero">
  <p class="credit" data-i18n="credit"></p>
  <h1 data-i18n="title"></h1>
  <p class="sub" data-i18n="subtitle"></p>
  <div class="photos hero-ph">
    <figure><img src="photos/souvenir.jpg" alt="" data-alt="phSouvAlt" loading="lazy"><figcaption data-i18n="phSouv"></figcaption></figure>

<main class="wrap">

<!-- 1 -->
<section id="s1" style="border-top:0;padding-top:24px">
  <h2><span class="n">1</span><span data-i18n="h1"></span></h2>
  <div class="prose"><p data-i18n="p1"></p></div>
  <div class="sim" id="hero">
    <div class="viz">
      <svg id="cutSvg" viewBox="-110 44 760 414" role="img" aria-labelledby="cutTitle"><title id="cutTitle" data-i18n="cutAria"></title></svg>
    </div>
    <div class="controls">
      <div class="press-row">
        <button class="btn big" id="pressBtn" aria-pressed="false" data-i18n="press"></button>

      </div>
      <p class="small" style="margin:0" data-i18n="pressHint"></p>
      <div class="ctl"><label><span data-i18n="travel"></span><output id="xOut"></output></label><input type="range" id="xSl" min="0" max="4" step="0.01" value="0"></div>
      <label class="check"><input type="checkbox" id="slowCk"><span data-i18n="slow"></span></label>
      <label class="check"><input type="checkbox" id="soundCk" checked><span data-i18n="sound"></span></label>

        <dt data-i18n="rJacket"></dt><dd id="jOut"></dd>
        <dt data-i18n="rContact"></dt><dd id="cOut"></dd>
        <dt data-i18n="rCurrent"></dt><dd id="iOut"></dd>
      </dl>
      <p class="small" style="margin:0" data-i18n="heroNote"></p>

  </div>
  <p class="phhead" data-i18n="ph1h"></p>
  <div class="photos">
    <figure><img src="photos/led-slot.jpg" alt="" data-alt="phLedAlt" loading="lazy"><figcaption data-i18n="phLed"></figcaption></figure>
    <figure><img src="photos/legs-side.jpg" alt="" data-alt="phLegsAlt" loading="lazy"><figcaption data-i18n="phLegs"></figcaption></figure>
    <figure><img src="photos/hook-pin-a.jpg" alt="" data-alt="phHookAlt" loading="lazy"><figcaption data-i18n="phHook"></figcaption></figure>
    <figure><img src="photos/back-plus-face.jpg" alt="" data-alt="phBackAlt" loading="lazy" style="height:auto"><figcaption data-i18n="phBack"></figcaption></figure>
  </div>
</section>

<!-- 2 -->
<section id="s3">
  <h2><span class="n">2</span><span data-i18n="h3"></span></h2>
  <div class="prose"><p data-i18n="p3a"></p></div>

  <div class="prose"><p data-i18n="p3b"></p></div>
  <div class="sim">
    <div class="viz">
      <svg id="schemSvg" viewBox="0 0 560 250" role="img" aria-labelledby="schemTitle"><title id="schemTitle" data-i18n="schemAria"></title></svg>
      <svg id="ivSvg" viewBox="0 0 560 330" role="img" aria-labelledby="ivTitle"><title id="ivTitle" data-i18n="ivAria"></title></svg>

      <div class="ctl"><label><span data-i18n="emf"></span><output id="eOut"></output></label><input type="range" id="eSl" min="2" max="3.3" step="0.01" value="3.0"></div>
      <div class="ctl"><label><span data-i18n="rint"></span><output id="rOut"></output></label><input type="range" id="rSl" min="5" max="100" step="1" value="30"></div>

<!-- 3 -->
<section id="s5">

<!-- 4 -->

<script>
(function(){
const LANG = document.documentElement.lang === 'ko' ? 'ko' : 'en';

 h7:"Why the color keeps changing",
 p7a:"Hold the key down and the toy's LED drifts from one color to the next. It is a self-cycling RGB LED. The 3 mm dome holds three tiny LED chips (red, green, and blue) and a small control chip, all fed by the same two legs. While the switch is closed, the control chip runs its built-in clock and switches the three chips on and off in a programmed sequence.",
 p7b:"Mixed colors such as yellow, cyan, and magenta come from running two chips together. The control chip switches each chip on and off hundreds or thousands of times a second (pulse-width modulation, PWM) and varies the fraction of time it is on, its duty cycle. Your eye averages the flicker, so the color seems to drift smoothly. Releasing the key cuts the power and the control chip resets, so each press starts the cycle again from the same color.",
 p7c:"Each chip is still a diode on the battery's load line, but the operating point now hops between three curves. The red chip needs only about 2 V and draws far more current than the green and blue chips, which need nearly the full 3 V of the cell. That is why, on a tired cell, the green and blue phases fade first while red stays bright; the next section shows this in detail.",

const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function el(tag, attrs, parent, text){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; if (parent) parent.appendChild(e); return e; }
const clear = s => { [...s.childNodes].forEach(n => { if (n.nodeName !== 'title') s.removeChild(n); }); };

/* ---------- physics models ---------- */
const XCLICK = 1.8, XACT = 2.2, XREL = 2.0, XMAX = 4.0;
const Fspring = x => 30 + 7*x;
const Fpress = x => Fspring(x) + (x < XCLICK ? 20*Math.pow(x/XCLICK, 2) : 20*Math.exp(-(x - XCLICK)/0.08));
const Frelease = x => Fspring(x) - 4;
const integ = (f, a, b, n=2000) => { let s = 0, h = (b-a)/n; for (let i=0;i<n;i++) s += f(a + (i+0.5)*h); return s*h; };
const WP = integ(Fpress, 0, XMAX)*1e-5, WR = integ(Frelease, 0, XMAX)*1e-5;   // J (cN·mm = 1e-5 J)
const COLORS = [
  {k:'red', vf:1.95, nvt:0.050, col:'#FF3B30'}, {k:'yellow', vf:2.05, nvt:0.050, col:'#FFC400'},
  {k:'green', vf:2.85, nvt:0.060, col:'#2ECC40'}, {k:'blue', vf:2.95, nvt:0.060, col:'#2F6BFF'},
  {k:'cyan', vf:3.00, nvt:0.060, col:'#2FD9E8'}, {k:'white', vf:3.00, nvt:0.062, col:'#E8F0FF'}
];
const RS = 12, CAP = 0.037;   // LED series resistance (ohm), cell capacity (Ah)
const vLed = (c, i) => { const Is = 0.010/Math.exp((c.vf - 0.010*RS)/c.nvt); return c.nvt*Math.log(1 + i/Is) + i*RS; };
function opPoint(c, E, r){
  if (E <= 0) return 0;
  let lo = 0, hi = E/r;
  for (let k=0;k<80;k++){ const m = (lo+hi)/2; if (E - m*r - vLed(c, m) > 0) lo = m; else hi = m; }
  return (lo+hi)/2;
}

/* ---------- state ---------- */
const S = { x:0, target:0, jacketDown:false, contact:false, E:3.0, r:30, color:'green', pin1:'pos', pin2:'neg', cycle:true, period:3, pwm:false, tOn:null, hold:0.2, slow:false, sound:true };
const col = () => COLORS.find(c => c.k === S.color);
const pinsOK = () => S.pin1 === 'pos' && S.pin2 === 'neg';
const iNow = () => opPoint(col(), S.E, S.r);
const lit = () => S.contact && pinsOK();

/* ---------- sound ---------- */
let AC = null;
function clickSound(strength){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const n = Math.floor(AC.sampleRate*0.018), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.exp(-i/(n*0.18));
    const src = AC.createBufferSource(); src.buffer = buf;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 1.4;
    const g = AC.createGain(); g.gain.value = 0.9*strength;
    src.connect(bp); bp.connect(g); g.connect(AC.destination); src.start();
  } catch(e){}
}

  el('path',{d:'M78 262 L78 160 A42 42 0 0 1 162 160 L162 262 Z',style:'fill:color-mix(in srgb,var(--panel) 70%,transparent);stroke:var(--muted);stroke-width:1.5'},g);
  el('rect',{x:72,y:262,width:96,height:8,rx:2,style:'fill:none;stroke:var(--muted);stroke-width:1.5'},g);
  el('line',{x1:100,y1:270,x2:100,y2:310,style:'stroke:var(--leaf);stroke-width:3'},g); el('line',{x1:140,y1:270,x2:140,y2:310,style:'stroke:var(--leaf);stroke-width:3'},g);
  el('text',{x:100,y:306,'font-size':11,'text-anchor':'end',dx:-6,style:'fill:var(--muted)'},g,'+'); el('text',{x:140,y:306,'font-size':11,dx:6,style:'fill:var(--muted)'},g,'−');
  DIES.forEach((c, k) => { const x = 90 + k*22, lv = on ? C.d[k]*(0.3 + 0.7*Math.sqrt(clamp01(C.ik[k]/0.006))) : 0;
    el('rect',{x,y:200,width:16,height:16,rx:2,style:`fill:${lv > 0.02 ? c.col : '#C9CED6'};opacity:${lv > 0.02 ? 0.35 + 0.65*lv : 1};stroke:var(--muted);stroke-width:1`},g);
    el('text',{x:x+8,y:232,'font-size':11,'text-anchor':'middle',style:'fill:var(--muted)'},g,'RGB'[k]); });
  el('rect',{x:104,y:240,width:32,height:16,rx:2,style:'fill:#232833'},g);
  el('text',{x:120,y:252,'font-size':9,'text-anchor':'middle',style:'fill:#fff'},g,'IC');
  el('line',{x1:136,y1:248,x2:178,y2:272,style:'stroke:var(--muted);stroke-width:1'},g);
  el('text',{x:180,y:282,'font-size':12,style:'fill:var(--muted)'},g,T.lbIC);
  // one color cycle: strip and duty cycles
  const X0 = 236, X1 = 544, PX = h => X0 + (X1 - X0)*h/6;
  el('text',{x:X0,y:28,'font-size':12.5,style:'fill:var(--muted)'},g,T.lbCycle + ` (T = ${S.period.toFixed(1)} ${LANG === 'ko' ? '초' : 's'})`);
  for (let k=0;k<72;k++){ const h = 6*k/72; el('rect',{x:PX(h),y:36,width:(X1-X0)/72+0.6,height:24,style:`fill:${mix(h + 3/72)}`},g); }
  el('rect',{x:X0,y:36,width:X1-X0,height:24,style:'fill:none;stroke:var(--line);stroke-width:1'},g);
  const Y0 = 160, Y1 = 78, Yd = v => Y0 - (Y0 - Y1)*v;
  el('line',{x1:X0,x2:X1,y1:Y0,y2:Y0,class:'axis'},g); el('line',{x1:X0,x2:X0,y1:Y1,y2:Y0,class:'axis'},g);
  el('text',{x:X0-6,y:Yd(1)+4,'font-size':11,'text-anchor':'end',style:'fill:var(--muted)'},g,'100%'); el('text',{x:X0-6,y:Y0+4,'font-size':11,'text-anchor':'end',style:'fill:var(--muted)'},g,'0');
  el('text',{x:(X0+X1)/2,y:Y0+16,'font-size':12,'text-anchor':'middle',style:'fill:var(--muted)'},g,T.lbDuty);
  DIES.forEach((c, k) => { const pts = []; for (let j=0;j<=120;j++){ const h = 6*j/120; pts.push([PX(h), Yd(dutiesAt(h)[k]) + (k-1)*1.5]); }
    el('path',{d:pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(''),style:`fill:none;stroke:${c.col};stroke-width:2.4`},g); });
  if (on) el('line',{x1:PX(C.h),x2:PX(C.h),y1:32,y2:Y0,style:'stroke:var(--ink);stroke-width:2'},g);
  // PWM pulses for the present duty cycles, three periods, slowed down
  const P0 = 216, rowH = 28;
  if (S.pwm){
    el('text',{x:X0,y:P0-6,'font-size':12,style:'fill:var(--muted)'},g,T.lbPWM);
    DIES.forEach((c, k) => { const y = P0 + 8 + k*rowH, d = on ? C.d[k] : 0, w = (X1 - X0)/3; let p = `M${X0} ${y+18}`;
      for (let n=0;n<3;n++){ const x = X0 + n*w; if (d > 0.001){ p += ` L${x} ${y+18} L${x} ${y} L${x + w*d} ${y} L${x + w*d} ${y+18}`; } p += ` L${x + w} ${y+18}`; }
      el('path',{d:p,style:`fill:none;stroke:${c.col};stroke-width:2`},g);
      el('text',{x:X0-6,y:y+14,'font-size':11,'text-anchor':'end',style:'fill:var(--muted)'},g,'RGB'[k]); });
  } else el('text',{x:X0,y:P0+30,'font-size':12.5,style:'fill:var(--muted)'},g,T.lbPWMoff);
  // I–V view of the three chips on the battery's load line
  const ymax = Math.max(10, Math.ceil(Math.max(...C.ik)*1000*1.3/5)*5);
  const Q = frame($('rgbIV'), {x0:1.5, x1:3.4, y0:0, y1:ymax, xt:ticks(1.5,3.4,0.25).filter((t,i)=>i%2===0), yt:ticks(0,ymax,ymax>20?10:2), xl:T.vlab, yl:T.ilab});
  DIES.forEach(c => { const pts = []; for (let k=0;k<=300;k++){ const ii = (ymax*1.2/1000)*k/300; pts.push([vLed(c, ii), ii*1000]); } Q.line(pts, `stroke:${c.col};stroke-width:2.6`); });
  Q.line([[0, S.E/S.r*1000],[S.E, 0]], 'stroke:var(--ink);stroke-width:2;stroke-dasharray:7 4');
  DIES.forEach((c, k) => { const op = on ? 0.15 + 0.85*C.d[k] : 0.25;
    el('circle',{cx:Q.X(vLed(c, C.ik[k])),cy:Q.Y(C.ik[k]*1000),r:7,style:`fill:${c.col};stroke:var(--ink);stroke-width:1.5;opacity:${op}`},Q.g); });
  // readouts
  $('cycPeriodOut').textContent = S.period.toFixed(1) + (LANG === 'ko' ? '초' : ' s');
  $('rgbName').textContent = on ? T.colors[C.name] : '—';
  $('rgbDuty').textContent = on ? C.d.map(v => Math.round(v*100) + '%').join(' · ') : '—';
  $('rgbAvg').textContent = on ? (C.iavg*1000).toFixed(2) + T.mA : '0.00' + T.mA;
  $('rgbDies').textContent = C.ik.map(i => (i*1000).toFixed(1)).join(' · ') + T.mA;
  $('rgbTime').textContent = on ? C.t.toFixed(1) + (LANG === 'ko' ? '초' : ' s') : '—';
}
let cycRaf = null;
function cycLoop(){
  if (S.cycle && lit()){ drawCut(); drawSchem(); drawRGB(); readouts(); cycRaf = requestAnimationFrame(cycLoop); }
  else { cycRaf = null; drawRGB(); }
}
function startCyc(){ if (!cycRaf && S.cycle && lit()) cycRaf = requestAnimationFrame(cycLoop); }

function readouts(){
  $('xSl').value = S.x; $('xOut').textContent = S.x.toFixed(2) + T.mm;
  const pressing = S.target > S.x || (S.target === S.x && S.target > 0);
  $('jOut').textContent = S.jacketDown ? T.jDown : T.jUp;
  $('cOut').textContent = S.contact ? T.closed : T.open;
  $('iOut').textContent = (lit() ? iShown()*1000 : 0).toFixed(2) + T.mA;
  const cs = $('contactState'); cs.classList.toggle('on', lit()); cs.querySelector('x').textContent = S.contact ? T.contactClosed : T.contactOpen;
  $('pressBtn').setAttribute('aria-pressed', S.target > 0 ? 'true' : 'false'); $('pressBtn2').setAttribute('aria-pressed', S.target > 0 ? 'true' : 'false');
}
function drawAll(){ drawCut(); drawSchem(); drawIV(); drawColors(); drawPins(); drawRGB(); readouts(); }

/* ---------- mechanics of pressing ---------- */
function updateMech(prev){
  if (S.x >= XCLICK && prev < XCLICK && !S.jacketDown){ S.jacketDown = true; clickSound(1); }
  if (S.x < 0.6 && S.jacketDown){ S.jacketDown = false; clickSound(0.35); }
  if (!S.contact && S.x >= XACT){ S.contact = true; S.tOn = performance.now(); startCyc(); }
  if (S.contact && S.x < XREL){ S.contact = false; S.tOn = null; drawRGB(); }
}
let raf = null, last = 0;
function tick(t){
  const dt = Math.min(0.05, (t - last)/1000 || 0); last = t;
  const v = S.slow ? 3 : 45, prev = S.x;
  if (S.x < S.target) S.x = Math.min(S.target, S.x + v*dt); else if (S.x > S.target) S.x = Math.max(S.target, S.x - v*dt);
  updateMech(prev); drawCut(); drawSchem(); drawPins(); readouts();
  if (S.x !== S.target) raf = requestAnimationFrame(tick); else raf = null;
}
function press(down){ S.target = down ? XMAX : 0; if (!raf){ last = performance.now(); raf = requestAnimationFrame(tick); } }
const pb = $('pressBtn');
pb.addEventListener('pointerdown', e => { e.preventDefault(); press(true); try { pb.setPointerCapture(e.pointerId); } catch (_) {} });
pb.addEventListener('pointerup', () => press(false)); pb.addEventListener('pointercancel', () => press(false));
pb.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat){ e.preventDefault(); press(true); } });
pb.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); press(false); } });
document.addEventListener('keydown', e => { if (e.key === ' ' && !e.repeat && e.target === document.body){ e.preventDefault(); press(true); } });
document.addEventListener('keyup', e => { if (e.key === ' ' && e.target === document.body){ e.preventDefault(); press(false); } });
$('xSl').addEventListener('input', e => { const prev = S.x; S.x = S.target = +e.target.value; updateMech(prev); drawCut(); drawSchem(); drawPins(); readouts(); });
$('slowCk').addEventListener('change', e => S.slow = e.target.checked);
const pb2 = $('pressBtn2');
pb2.addEventListener('pointerdown', e => { e.preventDefault(); press(true); try { pb2.setPointerCapture(e.pointerId); } catch (_) {} });
pb2.addEventListener('pointerup', () => press(false)); pb2.addEventListener('pointercancel', () => press(false));
pb2.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat){ e.preventDefault(); press(true); } });
pb2.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); press(false); } });
$('cycCk').addEventListener('change', e => { S.cycle = e.target.checked; drawAll(); startCyc(); });
$('cycSl').addEventListener('input', e => { S.period = +e.target.value; drawRGB(); });
$('pwmCk').addEventListener('change', e => { S.pwm = e.target.checked; drawRGB(); });
$('soundCk').addEventListener('change', e => S.sound = e.target.checked);
$('eSl').addEventListener('input', e => { S.E = +e.target.value; drawAll(); });
$('rSl').addEventListener('input', e => { S.r = +e.target.value; drawAll(); });
$('colorSeg').innerHTML = COLORS.map(c => `<button type="button" data-k="${c.k}" aria-pressed="${c.k===S.color}">${T.colors[c.k]}</button>`).join('');
$('colorSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.color = b.dataset.k; [...$('colorSeg').children].forEach(x => x.setAttribute('aria-pressed', x === b)); drawAll(); });
const pinSeg = (id, key, opts) => { $(id).innerHTML = opts.map(([k,t]) => `<button type="button" data-k="${k}" aria-pressed="${S[key]===k}">${T[t]}</button>`).join('');
  $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S[key] = b.dataset.k; [...$(id).children].forEach(x => x.setAttribute('aria-pressed', x === b)); drawAll(); }); };
const OPTS = [['neg','tNeg'],['pos','tPos'],['none','tNone']];
pinSeg('pin1Seg', 'pin1', OPTS); pinSeg('pin2Seg', 'pin2', OPTS);
$('pinReset').addEventListener('click', () => { S.pin1 = 'pos'; S.pin2 = 'neg'; pinSeg('pin1Seg','pin1',OPTS); pinSeg('pin2Seg','pin2',OPTS); drawAll(); });
const st = document.createElement('style'); st.textContent = '@keyframes dash{to{stroke-dashoffset:-15.1}} @media (prefers-reduced-motion:reduce){svg .flow{animation:none!important}}'; document.head.appendChild(st);
new MutationObserver(drawAll).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
drawAll();

/* ---------- light/dark switch (shared with the other course demos) ---------- */
const btn = $('themeBtn'), root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
const current = () => root.dataset.theme || (mq.matches ? 'dark' : 'light');
const sync = () => { const dark = current() === 'dark', label = dark ? T.themeLight : T.themeDark; btn.innerHTML = dark ? SUN : MOON; btn.setAttribute('aria-label', label); btn.title = label; };
btn.addEventListener('click', () => { const next = current() === 'dark' ? 'light' : 'dark'; root.dataset.theme = next; try { localStorage.setItem('netsci-theme', next); } catch (e) {} sync(); });
mq.addEventListener('change', () => { sync(); drawAll(); });
sync();
})();
